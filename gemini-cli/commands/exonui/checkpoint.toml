description = "Save a portable ExonUI Relay checkpoint (.exonui/relay/) for resuming or switching agents."
prompt = """
Save an ExonUI Relay handoff packet for the current session (optional target agent: {{args}}).

1. Summarize concise, secret-free session state: `goal`, `plan`, `decisions`, `designRefs`, `packs`, `filesChanged` (or `autoDetectFiles: true`), `openQuestions`, and `nextStep`.
2. Call `relay_checkpoint` (or run `npx -y exonui@latest relay checkpoint --goal "..." --next "..."` if Grid is in `direct` mode).
3. Report the saved checkpoint ID and both resume commands: `/exonui:resume <id>` and `npx exonui relay --to <target> <id>`.
"""
