description = "Build responsive, accessible UI from a Paper artboard using Grid, shadcn/ui, and Playwright."
prompt = """
Run the ExonUI **Paper to Code** workflow for target: {{args}}

1. Inspect the Paper canvas first via `grid_search` -> `grid_describe` -> `grid_call` (`paper:get_basic_info`, `paper:get_selection`, `paper:get_tree_summary`, `paper:get_computed_styles`, `paper:get_jsx`).
2. Read `library_docs` for `shadcn` and fetch UI primitives safely via `component_get`.
3. Convert design tokens and verify WCAG 2.2 AA contrast using `design_utils` (`tokens_convert`, `contrast`).
4. Build all component states, responsive layouts (360px+), and dark mode, verify in `playwright`, and save a `relay_checkpoint`.
"""
